<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Google picks the favicon for a search result from these, and wants one
         at least 48x48 at a stable URL. An SVG alone is accepted but a raster
         fallback is what actually gets shown most reliably. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mune Work — Find work that fits. Hire people who fit.</title>
    <meta name="description" content="Mune Work matches job seekers to roles that fit their skills and preferences, and gives employers ranked candidates instead of a pile of CVs. Build a profile, get matched, apply in one click." />
    <link rel="canonical" href="https://munework.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Link previews. Without these, anything shared on LinkedIn, X, Slack or
         WhatsApp renders as a bare URL with no title, text or image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mune Work" />
    <meta property="og:title" content="Mune Work — Find work that fits. Hire people who fit." />
    <meta property="og:description" content="Get matched to roles that fit your skills and preferences. Employers get ranked candidates, not a pile of CVs." />
    <meta property="og:url" content="https://munework.com/" />
    <meta property="og:image" content="https://munework.com/brand/og-image-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mune Work" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mune Work — Find work that fits. Hire people who fit." />
    <meta name="twitter:description" content="Get matched to roles that fit your skills and preferences. Employers get ranked candidates, not a pile of CVs." />
    <meta name="twitter:image" content="https://munework.com/brand/og-image-1200x630.png" />

    <meta name="theme-color" content="#0b0c10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mune Work" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS ignores SVG here and falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" href="/brand/logo-mark-180.png" />

    <!--
      WebSite is what Google reads to decide the site name shown above a
      result — the bold "Mune Work" line rather than a guess from the domain.
      Organization drives the knowledge panel and the result favicon.

      Note there is no SearchAction here: Google deprecated the sitelinks
      searchbox in 2024 and no longer renders it, so including it is noise.
      The sub-links under a result are sitelinks, which are generated
      algorithmically from site structure and traffic and cannot be requested
      through markup.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://munework.com/#website",
            "url": "https://munework.com",
            "name": "Mune Work",
            "alternateName": ["MuneWork", "Mune"],
            "publisher": { "@id": "https://munework.com/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://munework.com/#organization",
            "name": "Mune Work",
            "alternateName": "MuneWork",
            "url": "https://munework.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://munework.com/brand/logo-mark-512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://munework.com/brand/og-image-1200x630.png",
            "description": "A job marketplace that matches candidates to roles on skills, preferences and fit.",
            "email": "support@munework.com",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@munework.com",
              "availableLanguage": "English"
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
